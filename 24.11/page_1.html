<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой сайт</title>
    <link rel="stylesheet" href="page_1.css">
</head>
<body>

    <div class="status-bar">
        <span id="player-turn">Ход: Игрок 1</span>
        <span id="attempts-left">Попыток: 5</span>

    <div class="controls">

        <button id="reset-btn">Сброс</button>
    </div>

    <div id="cities-list"></div>

<script src="page_1.js"></script>
</body>
</html>
